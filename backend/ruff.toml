target-version = "py312"

[lint]
# Ruff's default set (E4/E7/E9 + F) plus import sorting (I), which is safe and
# autofixable. Deliberately narrow: this exists to catch the things that are
# silently wrong - unused imports, undefined names, jumbled imports - not to
# restyle the codebase.
select = ["E4", "E7", "E9", "F", "I"]

# `Column == True` is how you write a boolean filter in SQLAlchemy; the
# suggested `if Column:` rewrite is a different expression, which is why ruff
# marks the fix unsafe. All five occurrences are inside .filter() calls.
ignore = ["E712"]
